<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>proBetAze - Avtomatik Proqnozlar</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00ff88; }
        .match-card { background: #1e1e1e; margin: 15px auto; padding: 15px; border-radius: 8px; max-width: 600px; border-left: 5px solid #00ff88; }
        .teams { font-size: 18px; font-weight: bold; }
        .details { margin-top: 10px; color: #ccc; font-size: 14px; }
        .badge { background: #00ff88; color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>proBetAze Günlük Proqnozlar</h1>
    <div id="predictions">Yüklənir...</div>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                let html = '';
                if(!data || data.length === 0) {
                    html = '<p style="text-align:center;">Bu gün üçün oyun tapılmadı.</p>';
                } else {
                    data.forEach(m => {
                        html += `
                            <div class="match-card">
                                <div class="teams">${m.homeTeam} vs ${m.awayTeam}</div>
                                <div class="details">
                                    <p>Liqa: ${m.league}</p>
                                    <p>Dəqiq Hesab: <span class="badge">${m.scores}</span></p>
                                    <p>Seçimlər: ${m.predictions.join(', ')}</p>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('predictions').innerHTML = html;
            })
            .catch(err => {
                document.getElementById('predictions').innerHTML = '<p style="text-align:center;">Hələlik proqnozlar yenilənməyib.</p>';
            });
    </script>
</body>
</html>
