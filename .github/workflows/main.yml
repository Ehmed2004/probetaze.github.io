name: Update Daily Predictions

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python generate.py

      - name: Commit and push changes
        run: |
          git config --global user.name "proBetAze Bot"
          git config --global user.email "bot@probetaze.com"
          git add data.json
          git commit -m "Auto update predictions" || exit 0
          git push
